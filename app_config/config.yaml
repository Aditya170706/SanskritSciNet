server:
  host: "0.0.0.0"
  port: 8000
  reload: false
  workers: 1

ui:
  host: "localhost"
  port: 8501
  api_url: "http://localhost:8000"

pipeline:
  top_k: 5
  use_neo4j: false
  use_cache: true
  build_index: true

security:
  max_input_length: 1000
  min_input_length: 2
  allowed_unicode_blocks:
    - devanagari      # U+0900–U+097F
    - latin           # ASCII + Latin extended
    - digits
    - punctuation

logging:
  level: "INFO"
  dir: "logs"
  max_bytes: 10485760     # 10 MB
  backup_count: 5

metrics:
  dir: "metrics"
  enabled: true
  flush_interval: 60      # seconds

paths:
  models_dir:   "models"
  database_dir: "database"
  data_dir:     "data"
